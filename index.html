<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ai-ssh.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>AI SSH · 智能运维平台</title>
    <style>
      /* Native scrollbar styling — in index.html to bypass Vite CSS processing */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--surface-scrollbar, rgba(128, 140, 155, 0.35));
        border-radius: 5px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--surface-scrollbar-hover, rgba(128, 140, 155, 0.55));
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-corner { background: transparent; }
      html, body { background: #14161b; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f4f6f9; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
